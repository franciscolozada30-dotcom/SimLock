name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga tu código
      - name: Descargar codigo (Checkout)
        uses: actions/checkout@v4

      # 2. Configura Java 17 (Requerido para Android)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configura Gradle (Instala la versión correcta automáticamente sin wrappers)
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.5

      # 4. Compila el APK usando el Gradle que acabamos de instalar
      - name: Compilar APK (Build APK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --stacktrace

      # 5. Sube el APK listo para que lo descargues
      - name: Subir APK (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
